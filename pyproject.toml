[project]
name = "medicia-ml"
version = "0.1.0"
description = "Inferencia de modelos de MedicIA: EchoNext-Mini."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.2,<3",
  "torch>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
